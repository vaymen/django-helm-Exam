{{- if eq .Values.database.mode "cnpg" }}
{{- $db := .Values.database.cnpg }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "django-app.dbClusterName" . }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  instances: {{ $db.instances }}
  {{- with $db.imageName }}
  imageName: {{ . }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ $db.name }}
      owner: {{ $db.name }}
      # Password is generated by the operator into the <cluster>-app Secret.
  storage:
    size: {{ $db.storage.size }}
    {{- with $db.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml $db.resources | nindent 4 }}
{{- end }}
