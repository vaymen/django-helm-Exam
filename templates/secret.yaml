{{- if not .Values.secret.existingSecret }}
{{- $name := include "django-app.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated once and reused on upgrade, so sessions/signing survive rollouts.
  {{ .Values.secret.key }}: {{ if $existing }}{{ index $existing.data .Values.secret.key }}{{ else }}{{ randAlphaNum 50 | b64enc }}{{ end }}
{{- end }}
