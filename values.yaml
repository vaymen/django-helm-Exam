replicaCount: 2

image:
  repository: docker.io/vaymen/django-app
  tag: "491db03"                    # git commit id of the django-app repo
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Non-secret Django settings -> ConfigMap
django:
  allowedHosts: ""                # REQUIRED: your hostname(s), comma-separated ("*" is rejected)
  debug: false
  logLevel: INFO
  behindProxy: true               # trust X-Forwarded-Proto from the ingress
  csrfTrustedOrigins: ""          # e.g. https://app.example.com
  workers: 2                      # gunicorn WEB_CONCURRENCY
  extraEnv: {}                    # additional plain env vars

# Django SECRET_KEY. Leave existingSecret empty to have the chart generate one
# (kept stable across upgrades); otherwise reference your own Secret.
secret:
  existingSecret: ""
  key: DJANGO_SECRET_KEY

database:
  # "cnpg"     -> chart creates a CloudNativePG Cluster (operator must be installed)
  # "external" -> use a database you already run; supply credentialsSecret.name
  mode: cnpg
  cnpg:
    instances: 1                  # 3 for HA
    imageName: ""                 # empty = operator default
    name: app                     # database / owner name
    storage:
      size: 5Gi
      storageClass: ""            # empty = cluster default
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  # Secret holding connection details. In cnpg mode, defaults to the
  # operator-generated "<release>-django-app-db-app" Secret (key names below match it).
  credentialsSecret:
    name: ""
    hostKey: host
    portKey: port
    nameKey: dbname
    userKey: username
    passwordKey: password

migrate:
  enabled: true                   # run `manage.py migrate` in an init container

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: django.example.com
      path: /
      pathType: Prefix
  tls: []

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 256Mi}

probes:
  startup:   {periodSeconds: 3, failureThreshold: 20}
  liveness:  {periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
  readiness: {periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
